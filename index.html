<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خريطة المنشآت الصحية</title><meta name="theme-color" content="#04352C"><link rel="manifest" href="./manifest.webmanifest?v=2026-08-07-6"><link rel="icon" type="image/svg+xml" href="./icons/icon.svg"><style>body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#eef2f0;color:#0c2a24;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:28px;text-align:center}.spin{width:42px;height:42px;border:4px solid #cbd8d3;border-top-color:#00795c;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#5e7570}button{margin-top:14px;padding:10px 16px;border:0;border-radius:10px;background:#00795c;color:#fff;font:inherit;cursor:pointer}</style></head><body><div class="box"><div class="spin"></div><h2>جاري تشغيل خريطة المنشآت…</h2><small id="msg">تحميل التطبيق</small><div><button id="retry" hidden>إعادة المحاولة</button></div></div><script>const VERSION='2026-08-07-6';const files=['./payload/chunk-00.txt','./payload/chunk-01.txt','./payload/chunk-02.txt','./payload/chunk-03.txt','./payload/chunk-04.txt','./payload/chunk-05.txt','./payload/chunk-06.txt','./payload/chunk-07a.txt','./payload/chunk-07b.txt','./payload/chunk-08.txt','./payload/chunk-09.txt'].map(x=>x+'?v='+VERSION);async function boot(){const msg=document.getElementById('msg'),retry=document.getElementById('retry');retry.hidden=true;try{if(!('DecompressionStream' in window))throw new Error('المتصفح لا يدعم تشغيل التطبيق');const parts=[];for(let i=0;i<files.length;i++){msg.textContent=`تحميل التطبيق ${i+1} من ${files.length}`;const r=await fetch(files[i],{cache:'no-store'});if(!r.ok)throw new Error(`تعذر تحميل الجزء ${i+1} (${r.status})`);parts.push((await r.text()).trim())}const bin=atob(parts.join(''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);msg.textContent='تشغيل التطبيق…';const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();html=html.replace('#btnInstall{display:none}','#btnInstall{display:inline-flex}');html=html.replace('const installBtn = document.getElementById("btnInstall");','const installBtn = document.getElementById("btnInstall"); if(installBtn && !window.matchMedia("(display-mode: standalone)").matches){installBtn.style.display="inline-flex";}');document.open();document.write(html);document.close()}catch(e){console.error(e);msg.textContent='تعذر تشغيل التطبيق: '+e.message;retry.hidden=false}}document.getElementById('retry').addEventListener('click',boot);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js?v='+VERSION,{scope:'./'}).catch(console.error);boot();</script></body></html>
