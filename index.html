<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خريطة المنشآت الصحية</title>
<meta name="theme-color" content="#04352C">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<style>body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#eef2f0;color:#0c2a24;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:28px;text-align:center}.spin{width:42px;height:42px;border:4px solid #cbd8d3;border-top-color:#00795c;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#5e7570}</style>
</head>
<body><div class="box"><div class="spin"></div><h2>جاري تشغيل خريطة المنشآت…</h2><small id="msg">تحميل التطبيق</small></div>
<script>
(async()=>{
 const msg=document.getElementById('msg');
 try{
  const r=await fetch('./payload/part-00.txt',{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const b64=(await r.text()).trim();
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window)) throw new Error('المتصفح قديم ولا يدعم فك ضغط التطبيق');
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  document.open(); document.write(html); document.close();
 }catch(e){console.error(e); msg.textContent='تعذر تشغيل التطبيق: '+e.message;}
})();
</script></body></html>
